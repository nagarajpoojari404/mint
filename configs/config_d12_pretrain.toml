[model]
embed_dim = 128
hidden_dim = 128
seq_length = 128
vocab_size = 50267
n_layers = 8
n_heads = 8
n_kv_heads = 2
head_dim = 64
rope_base_theta = 100000
tie_weights = true
pad_vocab_multiple = 64



[train]
mixed_precision = true
use_meta_device = true
compile_model = true
train_num_steps = 50
grad_clip = 1.2
log_every_n_steps = 1
eval_every_n_steps = 100
eval_num_steps = 10
core_eval_every_n_step = 500
gradient_accumulation_steps = 4

[train.lg]
wandb_enabled = false
wandb_project = "mint"
wandb_run_name = ""
wandb_entity = ""


[train.ckpt]
checkpoint_dir = "checkpoints"
save_checkpoint_every_n_steps = 200
keep_last_n_checkpoints = 1
resume_from_checkpoint = false
load_best_checkpoint = false


[train.sched]
unembedding_lr = 0.0004
embedding_lr = 0.002
matrix_lr = 0.002
scalar_lr = 0.05
warmup_steps = 5
muon_momentum_warmup_steps = 400
muon_momentum_start = 0.85
muon_momentum_peak = 0.97
muon_momentum_final = 0.9
warmdown_ratio = 0.65
final_lr_frac = 0.1
weight_decay = 0.0
weight_decay_lm_head = 0.01
weight_decay_embedding = 0.001
weight_decay_scalar = 0.05
scalar_lr_multiplier = 0.01

[train.profiler]
enabled = true
output_dir = "./profiles"
schedule_wait = 3
schedule_warmup = 2
schedule_active = 10
schedule_repeat = 0
record_shapes = true
profile_memory = true
with_stack = false
with_flops = true
activities = ["cpu", "cuda"]
trace_prefix = "trace"
run_name = "vocabpad_bs128_fusedslice"

[optim]
muon_momentum = 0.95
muon_beta2 = 0.9
muon_ns_steps = 5
adamw_beta1 = 0.8
adamw_beta2_lm_head = 0.96
adamw_beta2_embedding = 0.995
adamw_beta2_scalar = 0.95
adamw_eps = 1.0e-10

[device]
mixed_precision = true

[dl]
data_dir = "data/climbmix"
batch_size = 128
buffer_size = 1000
tokenizer_batch_size = 128
seq_length = 128